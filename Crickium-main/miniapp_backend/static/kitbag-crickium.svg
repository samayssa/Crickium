<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 176" role="img" aria-labelledby="title desc">
  <title id="title">Crickium Green Kit Bag</title>
  <desc id="desc">A premium evergreen cricket kit bag with lime stripes and Crickium branding.</desc>
  <defs>
    <linearGradient id="bagBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#49734a"/>
      <stop offset=".42" stop-color="#285638"/>
      <stop offset="1" stop-color="#102a1d"/>
    </linearGradient>
    <linearGradient id="bagFlap" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#65904d"/>
      <stop offset="1" stop-color="#1c482e"/>
    </linearGradient>
    <linearGradient id="bagSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#173e29"/>
      <stop offset="1" stop-color="#0b2118"/>
    </linearGradient>
    <linearGradient id="zipper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b5d957"/>
      <stop offset=".5" stop-color="#f3d27b"/>
      <stop offset="1" stop-color="#a4ce4b"/>
    </linearGradient>
    <filter id="bagShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>
  <g filter="url(#bagShadow)">
    <!-- carry handle and upper piping -->
    <path d="M56 38V26c0-10 8-17 24-17s24 7 24 17v12" fill="none" stroke="#163a26" stroke-width="9" stroke-linecap="round"/>
    <path d="M57 37V27c0-8 8-13 23-13s23 5 23 13v10" fill="none" stroke="#83a957" stroke-width="3.5" stroke-linecap="round"/>
    <!-- right gusset -->
    <path d="M119 45l18 10 2 79-20 14z" fill="url(#bagSide)" stroke="#75944b" stroke-width="1.8"/>
    <path d="M129 63l5 3v58l-5 3z" fill="#416c3b" opacity=".7"/>
    <!-- main bag shell -->
    <path d="M35 40Q36 31 47 31h64q11 0 13 11l8 86q1 12-10 17l-14 7H48l-13-9q-7-5-6-13z" fill="url(#bagBody)" stroke="#7f9d57" stroke-width="2.2"/>
    <path d="M40 48Q41 39 49 39h60q7 0 9 8l7 76q1 7-7 11l-12 7H50l-9-7q-5-4-5-10z" fill="none" stroke="#9cbd63" stroke-opacity=".38" stroke-width="1.2"/>
    <!-- sport-panel strips -->
    <path d="M47 43l12 0 13 91-12 0z" fill="#b7e55b"/>
    <path d="M65 41l6 0 13 94-6 0z" fill="#e9c66a" opacity=".96"/>
    <path d="M89 40l7 0 12 94-8 0z" fill="#a4d44b" opacity=".96"/>
    <path d="M109 41h4l8 82-5 2z" fill="#163f2a" opacity=".95"/>
    <!-- front pocket -->
    <path d="M42 92q0-6 7-7l57-1q7 0 8 7l3 26q0 7-7 9l-54 4q-7 0-8-7z" fill="#173b27" stroke="#789a4c" stroke-width="1.6"/>
    <path d="M45 96l66-2" stroke="url(#zipper)" stroke-width="2.7" stroke-linecap="round"/>
    <path d="M52 102l47-1" stroke="#62844b" stroke-width="1.1"/>
    <rect x="66" y="104" width="37" height="17" rx="4" fill="#10281c" stroke="#719447" stroke-width=".8"/>
    <text x="84.5" y="111.5" text-anchor="middle" fill="#c5ef61" font-family="Arial, sans-serif" font-weight="900" font-size="5.5" letter-spacing=".6">CRICKIUM</text>
    <text x="84.5" y="117" text-anchor="middle" fill="#efc66b" font-family="Arial, sans-serif" font-weight="700" font-size="3.3" letter-spacing=".65">PLAYER KIT</text>
    <!-- top zipper and animated flap group -->
    <g class="kitbag-svg-flap" id="kitbag-svg-flap">
      <path d="M38 43Q38 31 51 29h55q13 0 16 13l-10 20q-2 4-7 3L45 59q-7-1-7-8z" fill="url(#bagFlap)" stroke="#a9ca68" stroke-width="2"/>
      <path d="M46 42q2-5 9-5h48q6 0 8 5l-4 6-56-1z" fill="#173f29" stroke="#6b904a" stroke-width="1.2"/>
      <path d="M49 47l57 1" stroke="url(#zipper)" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M73 50l9 1" stroke="#f4d47c" stroke-width="3.4" stroke-linecap="round"/>
      <circle cx="84" cy="51" r="3.4" fill="#f0ce78" stroke="#513d19" stroke-width=".9"/>
    </g>
    <!-- straps, seams and glints -->
    <path d="M33 53l-5 56q-1 8 5 12l5 3" fill="none" stroke="#92ad58" stroke-width="2" stroke-linecap="round"/>
    <path d="M122 47l7 72" fill="none" stroke="#a6c76a" stroke-opacity=".55" stroke-width="1.4"/>
    <path d="M48 143h61" stroke="#75934f" stroke-width="2" stroke-linecap="round"/>
    <path d="M58 151h44" stroke="#c5ef61" stroke-width="1.5" stroke-linecap="round" opacity=".75"/>
    <path d="M42 58l5 1M115 69l2 19" stroke="#f0d27d" stroke-width="2" stroke-linecap="round" opacity=".9"/>
  </g>
</svg>
